# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8082

# ─── Application Info ─────────────────────────────────────────────────────────
spring.application.name=attendance-management

# ─── Actuator (for ALB health checks) ────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ─── App Info (shown in /actuator/info) ──────────────────────────────────────
info.app.name=Attendance Management System
info.app.version=1.0.0
info.app.description=CI/CD Demo Application

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.attendance=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
